name: release

on:
  push:
    tags: ['*-v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      TRIPLE: ${{ matrix.triple }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Resolve plugin from tag
        run: |
          set -euo pipefail
          name="${TAG%-v*}"
          version="${TAG##*-v}"
          [[ "$name" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || { echo "Invalid plugin name in tag" >&2; exit 1; }
          [[ "$version" =~ ^[0-9A-Za-z.+-]+$ ]] || { echo "Invalid version in tag" >&2; exit 1; }
          package=$(cargo metadata --format-version 1 --no-deps \
            | jq -r --arg pkg "focusdeck-$name" '.packages[] | select(.name == $pkg) | .version')
          [ -n "$package" ] || { echo "focusdeck-$name package not found" >&2; exit 1; }
          cargo run --locked -p focusdeck-index -- check-tag \
            --tag="$TAG" --name="$name" --version="$package"
          echo "NAME=$name" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked -p "focusdeck-$NAME"
      - name: Package
        run: |
          set -euo pipefail
          mkdir dist
          mv "target/release/focusdeck-$NAME" "dist/$NAME-$TRIPLE"
          (cd dist && sha256sum "$NAME-$TRIPLE" > "$NAME-$TRIPLE.sha256")
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ env.NAME }}-${{ matrix.triple }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.triple }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist
      - name: Verify artifacts
        run: (cd dist && sha256sum -c -- *.sha256)
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if state=$(gh release view "$TAG" --repo "$REPO" --json isDraft,assets \
            --jq '"\(.isDraft) \(.assets | length)"' 2>/dev/null); then
            read -r draft count <<<"$state"
            if [ "$draft" = true ]; then
              # a draft was never public, so what a failed run left in it gives way to this build
              gh release upload "$TAG" dist/* --repo "$REPO" --clobber
              gh release edit "$TAG" --repo "$REPO" --draft=false
            else
              # a published asset is never replaced: what is already out wins and only the gaps are filled
              mkdir published
              if [ "$count" -gt 0 ]; then
                gh release download "$TAG" --repo "$REPO" --dir published
              fi
              missing=()
              for file in dist/*; do
                name=$(basename "$file")
                if [ -e "published/$name" ]; then
                  cp "published/$name" "$file"
                else
                  bin=${name%.sha256}
                  if [ "$bin" != "$name" ] && [ -e "published/$bin" ]; then
                    # the checksum has to describe the binary that is already out, not this rebuild
                    (cd published && sha256sum "$bin") > "$file"
                  fi
                  missing+=("$file")
                fi
              done
              (cd dist && sha256sum -c -- *.sha256)
              if [ "${#missing[@]}" -gt 0 ]; then
                gh release upload "$TAG" "${missing[@]}" --repo "$REPO"
              fi
            fi
          else
            gh release create "$TAG" dist/* --repo "$REPO" --verify-tag --title "$TAG" --notes ""
          fi
      - run: rustup toolchain install
      - name: Build index tool
        run: cargo build --locked -p focusdeck-index
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          path: main
          persist-credentials: false
      - name: Update index
        working-directory: main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tool="$GITHUB_WORKSPACE/target/debug/focusdeck-index"
          name="${TAG%-v*}"
          version="${TAG##*-v}"
          description=$(cd "$GITHUB_WORKSPACE" && env -u GH_TOKEN cargo metadata --format-version 1 --no-deps \
            | jq -r --arg pkg "focusdeck-$name" '.packages[] | select(.name == $pkg) | .description')
          [ -n "$description" ] || { echo "focusdeck-$name has no description" >&2; exit 1; }
          args=()
          for triple in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            sum=$(cut -d' ' -f1 "$GITHUB_WORKSPACE/dist/$name-$triple.sha256")
            url="https://github.com/$REPO/releases/download/$TAG/$name-$triple"
            args+=(--target "$triple=$url,$sum")
          done
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          safe_git() {
            git -c core.hooksPath=/dev/null \
              -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              -c "http.extraheader=Authorization: basic $auth" "$@"
          }
          for attempt in 1 2 3 4 5; do
            safe_git fetch origin main
            safe_git reset --hard FETCH_HEAD
            env -u GH_TOKEN "$tool" set --index index.toml \
              --name "$name" --description "$description" --version "$version" "${args[@]}"
            safe_git add index.toml
            if safe_git diff --cached --quiet; then
              echo "Index already up to date"
              exit 0
            fi
            safe_git commit -m "Update index for $TAG"
            if safe_git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected, retrying ($attempt/5)" >&2
            sleep "$((attempt * 3))"
          done
          echo "Could not update the index after 5 attempts" >&2
          exit 1

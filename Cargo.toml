[workspace]
resolver = "3"
members = ["plugins/*"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
mockito = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"

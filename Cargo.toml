[workspace]
resolver = "3"
members = ["plugins/*", "tools/*"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.3"
mockito = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
toml = "1.2.1"
